name: Java-CI-with-Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  JAVA_VERSION: '17'

jobs:
  build-and-test:
    name: Checkstyle, Unit tests, Coverage
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

    - name: Run Checkstyle
      run: mvn -B checkstyle:check

    - name: Run tests + Coverage Check (80% minimum)
      run: mvn clean verify

  docker-build-push:
    name: Docker build and push
    needs: build-and-test
    runs-on: ubuntu-latest
    # Определяем матрицу: один параметр — модуль
    strategy:
      matrix:
        module: [api-gateway, auth-service, inventory-service, notification-service, order-service, product-service, user-service]
      fail-fast: false  # Продолжать, даже если один модуль провалился

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build Maven project (skip tests)
        run: mvn clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push module (${{ matrix.module }})
        run: |
          MODULE_DIR="${{ matrix.module }}"
          MODULE_NAME="${{ matrix.module }}"
          IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/$MODULE_NAME

          # Диагностика
          echo "🔍 Module directory: ./$MODULE_DIR"
          echo "🔍 Image name: $IMAGE_NAME"

          # Проверка директории
          if [ ! -d "$MODULE_DIR" ]; then
            echo "❌ Directory not found: ./$MODULE_DIR"
            ls -la
            exit 1
          fi

          # Проверка Dockerfile
          if [ ! -f "$MODULE_DIR/Dockerfile" ]; then
            echo "❌ Dockerfile missing in ./$MODULE_DIR"
            ls -la "$MODULE_DIR"
            exit 1
          fi

          echo "➡️ Building and pushing $IMAGE_NAME..."

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "$IMAGE_NAME:latest" \
            --tag "$IMAGE_NAME:${{ github.sha }}" \
            --file "$MODULE_DIR/Dockerfile" \
            --push true \
            "$MODULE_DIR"

          echo "✅ Pushed $IMAGE_NAME:latest and $IMAGE_NAME:${{ github.sha }}"

