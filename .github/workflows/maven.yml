name: Java-CI-with-Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  JAVA_VERSION: '17'

  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}  # Передаём секрет в env


jobs:
  build-and-test:
    name: Checkstyle, Unit tests, Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Run Checkstyle
        run: mvn -B checkstyle:check

      - name: Run tests + Coverage Check (80% minimum)
        run: mvn clean verify

  docker-build-push:
    name: Docker build and push
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [
          api-gateway,
          auth-service,
          inventory-service,
          notification-service,
          order-service,
          product-service,
          user-service
        ]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build Maven project (skip tests)
        run: mvn clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        # Автоматически создаёт builder с поддержкой multi-arch

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Validate Dockerfile exists
        run: |
          if [ ! -f "${{ matrix.module }}/Dockerfile" ]; then
            echo "❌ Dockerfile not found in ${{ matrix.module }}/"
            exit 1
          fi


      - name: Build and push module (${{ matrix.module }})
        env:
          MODULE_DIR: ${{ matrix.module }}
          IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.module }}
        shell: bash
        run: |
          echo "🔍 Debug: MODULE_DIR='$MODULE_DIR', IMAGE_NAME='$IMAGE_NAME'"

          # Проверки (уже пройдены, но оставим для надёжности)
          [ -d "$MODULE_DIR" ] || { echo "❌ Dir not found: $MODULE_DIR"; exit 1; }
          [ -f "$MODULE_DIR/Dockerfile" ] || { echo "❌ Dockerfile not found: $MODULE_DIR/Dockerfile"; exit 1; }

          # Сборка — ВАЖНО: все пути в кавычках, без лишних пробелов
          docker buildx build \
            --platform "linux/amd64,linux/arm64" \
            --tag "$IMAGE_NAME:latest" \
            --tag "$IMAGE_NAME:${{ github.sha }}" \
            --file "$MODULE_DIR/Dockerfile" \
            --push=true \
            "$MODULE_DIR"

          echo "✅ Success: Pushed $IMAGE_NAME:latest and $IMAGE_NAME:${{ github.sha }}"
